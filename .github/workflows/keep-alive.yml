name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

permissions:
  actions: write

# Each project is pinged in its own job, so one failing can never stop
# another from being pinged.
jobs:
  ping-eztaby:
    runs-on: ubuntu-latest
    steps:
      - name: Ping EZTaby (splitapp) Supabase project
        run: |
          curl -sf -o /dev/null -w "EZTaby ping: %{http_code}\n" \
            "https://hiypdbbywxrwqgzpmgux.supabase.co/rest/v1/_keepalive?select=id&limit=1" \
            -H "apikey: ${{ secrets.EZTABY_SUPABASE_KEY }}"

  # Publishable (anon) key: public by design, and RLS only lets it read the
  # tiny _keepalive table.
  ping-mythios:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Mythios Supabase project
        run: |
          curl -sf -o /dev/null -w "Mythios ping: %{http_code}\n" \
            "https://toqeuurdsyeifhpecagr.supabase.co/rest/v1/_keepalive?select=id&limit=1" \
            -H "apikey: sb_publishable_ICXEO9nRuilWdVF1WDSRMA_SVng5ADV"

  # MaxWord is paused (free plan = 2 active projects). Pinging a paused
  # project fails and can't wake it. When MaxWord is restored, add back a job
  # like ping-eztaby using https://dowhlyoufjmespcwyrke.supabase.co and the
  # MAXWORD_SUPABASE_KEY secret.

  # GitHub switches off scheduled workflows after 60 days without repo
  # commits. Re-enabling this workflow resets that 60-day timer.
  reset-github-timer:
    runs-on: ubuntu-latest
    steps:
      - name: Reset GitHub's 60-day inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"

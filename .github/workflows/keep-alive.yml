name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 3 */3 * *'   # runs every 3 days — well under Supabase's 7-day pause window
  workflow_dispatch:         # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MaxWord Supabase project
        run: |
          curl -s -o /dev/null -w "MaxWord ping: %{http_code}\n" \
            "https://dowhlyoufjmespcwyrke.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.MAXWORD_SUPABASE_KEY }}"

      - name: Ping EZTaby (splitapp) Supabase project
        run: |
          curl -s -o /dev/null -w "EZTaby ping: %{http_code}\n" \
            "https://hiypdbbywxrwqgzpmgux.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.EZTABY_SUPABASE_KEY }}"

name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MaxWord Supabase project
        run: |
          curl -s -o /dev/null -w "MaxWord ping: %{http_code}\n" \
            "https://dowhlyoufjmespcwyrke.supabase.co/rest/v1/_keepalive?select=id&limit=1" \
            -H "apikey: ${{ secrets.MAXWORD_SUPABASE_KEY }}"

      - name: Ping EZTaby (splitapp) Supabase project
        run: |
          curl -s -o /dev/null -w "EZTaby ping: %{http_code}\n" \
            "https://hiypdbbywxrwqgzpmgux.supabase.co/rest/v1/_keepalive?select=id&limit=1" \
            -H "apikey: ${{ secrets.EZTABY_SUPABASE_KEY }}"
